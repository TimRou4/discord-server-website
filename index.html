<!-- Говорит браузеру, что это HTML5-документ -->
<!DOCTYPE html>

<!-- Начало HTML-документа, lang="ru" означает русский язык страницы -->
<html lang="ru">

<head>
  <!-- Кодировка, чтобы нормально отображались русские буквы -->
  <meta charset="UTF-8">

  <!-- Делает сайт адаптивным под телефон -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Название вкладки в браузере -->
  <title>No Games No Fun</title>

  <!-- Подключает CSS-файл -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Верхний блок сайта с фоновым изображением -->
<section class="hero">

  <div class="hero__overlay"></div>

  <div class="hero-title">
    <img src="Pics/NGNF_Icon.png" alt="NGNF icon" class="hero-title-icon">
    <h1>No Games No Fun</h1>
  </div>

  <div class="container hero__content">
    <img class="server-avatar" src="Pics/NGNF_Avatar.png" alt="Server avatar">
  </div>

</section>

<div class="menu-bar">
  <button class="menu-button" type="button" aria-label="Open menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</div>

<aside class="side-menu">
  <nav class="side-menu__nav">
    <a href="#welcome">Главная</a>
    <a href="#roles">Роли</a>
    <a href="#ranks">Ранги</a>
    <a href="#rules">Правила</a>
    <a href="#about">О сервере</a>
  </nav>
</aside>

<!-- Основная часть сайта после верхнего фона -->
<main class="main">
  <div class="container">

    <!-- Здесь потом будет контент сайта -->

  </div>
</main>

  <!-- Нижняя часть сайта -->
  <footer class="footer">

    <!-- Контейнер для footer-контента -->
    <div class="container">

      <!-- Здесь можно будет добавить copyright, ссылки или контакты -->

    </div>
  </footer>

  <!-- Подключает JavaScript-файл -->
  <script src="script.js"></script>
</body>

</html>
