<!-- Говорит браузеру, что это HTML5-документ -->
<!DOCTYPE html>

<!-- Начало HTML-документа, lang="ru" означает русский язык страницы -->
<html lang="ru">

<head>
  <!-- Кодировка, чтобы нормально отображались русские буквы -->
  <meta charset="UTF-8">

  <!-- Делает сайт адаптивным под телефон -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Название вкладки в браузере -->
  <title>No Games No Fun</title>

  <!-- Подключает CSS-файл -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Верхняя часть сайта -->
  <header class="header">

    <!-- Контейнер ограничивает ширину контента -->
    <div class="container">

      <!-- Главный заголовок сайта -->
      <h1>Hello.</h1>

    </div>
  </header>

  <!-- Основная часть сайта -->
  <main class="main">

    <!-- Контейнер для будущего контента -->
    <div class="container">

      <!-- Здесь ты будешь добавлять свои блоки, карточки, текст, кнопки и т.д. -->

    </div>
  </main>

  <!-- Нижняя часть сайта -->
  <footer class="footer">

    <!-- Контейнер для footer-контента -->
    <div class="container">

      <!-- Здесь можно будет добавить copyright, ссылки или контакты -->

    </div>
  </footer>

  <!-- Подключает JavaScript-файл -->
  <script src="script.js"></script>
</body>

</html>
